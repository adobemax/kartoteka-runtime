name: Build media runtime for Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-media-runtime-windows.yml
      - package-lock.json
      - package.json
      - scripts/**
      - tests/fixtures/audio/**

permissions:
  contents: read

concurrency:
  group: media-runtime-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify win32-x64
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Check out build inputs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.8.0
          package-manager-cache: false

      - name: Install locked Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Set up MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: base-devel curl gnupg make diffutils pkgconf tar xz
          pacboy: toolchain:p

      - name: Download and verify official FFmpeg source
        shell: msys2 {0}
        run: |
          bash scripts/download_ffmpeg_source.sh
          bash scripts/verify_ffmpeg_source.sh

      - name: Build unsigned LGPL media runtime
        shell: msys2 {0}
        env:
          SKIP_MEDIA_PACKAGE: "1"
        run: bash scripts/build_media_runtime.sh win32-x64

      - name: Package Windows media runtime
        run: >-
          node scripts/package_media_runtime.cjs
          win32-x64
          release/media-runtime-build/win32-x64/ffmpeg-9.0.1

      - name: Verify codecs, probing, chunk extraction, silence detection, and Unicode paths
        run: >-
          npm run media:verify --
          release/media-runtime-ci/1.0.0-rc.1/media-runtime-ffmpeg-9.0.1-win32-x64.tar.gz
          win32-x64

      - name: Upload engineering build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-runtime-1.0.0-rc.1-win32-x64
          path: release/media-runtime-ci/1.0.0-rc.1/*win32-x64*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
